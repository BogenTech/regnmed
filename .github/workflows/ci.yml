# Frugal CI, three jobs:
# - test: format check + the full test suite against a real Postgres 18
#   service, so the DB-backed integration tests (ledger immutability,
#   auth boundary, SAF-T loader) run for real instead of skipping.
#   libxml2-utils provides xmllint so every run also validates our
#   generated XML against the official schemas: SAF-T (Skatteetaten),
#   pain.001 (ISO 20022) and EHF/UBL 2.1 (OASIS).
#
#   Run with cargo-nextest, not `cargo test`: the suite was 48 test
#   binaries, 33 of them holding a single test, and `cargo test` runs
#   binaries ONE AFTER ANOTHER. The tests wait on Postgres, not on CPU, so
#   there was almost no parallelism — measured 4 m 15 s at 129 % CPU.
#   nextest schedules every test as its own process across the binaries:
#   1 m 11 s at 633 % CPU locally, 3.6× faster, and four runs in a row gave
#   347/347 with no flakiness. The project has no doctests (verified), so
#   nextest leaves nothing out.
#
#   Do not raise --test-threads without looking at Postgres'
#   max_connections: each test opens its own pool, so concurrency costs
#   connections.
# - frugality: release binary sizes + regnmed-api peak RSS under load
#   against hard budgets (scripts/frugality.sh) — competing on the least
#   resources is a product principle, so a service that grows fat fails
#   the build (ROADMAP M6, docs/frugality.md).
# - portal: rebuilds the Svelte portal and fails if the checked-in
#   ui/portal/dist differs. The dist is checked in so the Rust build
#   never needs Node (#76) — that only holds if the artifact actually
#   matches its source, and a silent divergence would deploy a portal
#   nobody reviewed. Node lives HERE, never in the Rust build.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Manual retrigger: push events can be dropped wholesale during GitHub
  # Actions incidents (seen 2026-08-06), and a commit whose event was
  # dropped never gets a run any other way.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: regnmed
          POSTGRES_PASSWORD: regnmed
          POSTGRES_DB: regnmed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regnmed"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://regnmed:regnmed@localhost:5432/regnmed
      # Test binaries need no debuginfo in CI: the assert macros carry file
      # and line themselves, and nextest names the test that failed.
      # Measured: 1 m 17 s → 56 s to build, and target/ 5.2 → 2.9 GB —
      # which also shrinks the cache CI uploads and downloads. Locally the
      # profile is untouched.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      # Incremental compilation only helps when there is something from a
      # previous run to build on; in CI it costs writes and cache and
      # nothing else.
      CARGO_INCREMENTAL: 0
      # A pile of test binaries has to be linked, and the default linker is
      # the slow part.
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@v7
      - name: Install xmllint (XSD validation) and lld (faster linking)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils lld
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        run: curl -sSLf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - run: cargo fmt --all --check
      - run: cargo nextest run --workspace

  frugality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: regnmed
          POSTGRES_PASSWORD: regnmed
          POSTGRES_DB: regnmed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regnmed"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://regnmed:regnmed@localhost:5432/regnmed
      # The release build IS this whole job (4 m 07 s of 4 m 12 s, measured
      # 2026-07-29), so the linker is worth switching here too.
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@v7
      - name: Install lld (faster linking)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lld
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: frugality-release
      - name: Frugality gate
        run: scripts/frugality.sh | tee -a "$GITHUB_STEP_SUMMARY"

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `node-version` is the Node the portal is BUILT with. Which Node the
      # action itself runs on is a separate matter, and follows the
      # action's major version: v4 ran on Node 20, which is retired on the
      # runners.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/portal/package-lock.json
      - run: npm ci
        working-directory: ui/portal
      - run: npm run build
        working-directory: ui/portal
      - name: dist matches source
        run: |
          if ! git diff --exit-code -- ui/portal/dist; then
            echo "ui/portal/dist was not built from the current source — run scripts/build-portal.sh and check in the result." >&2
            exit 1
          fi
