# Frugal CI, three jobs:
# - test: format check + the full test suite against a real Postgres 18
#   service, so the DB-backed integration tests (ledger immutability,
#   auth boundary, SAF-T loader) run for real instead of skipping.
#   libxml2-utils provides xmllint so every run also validates our
#   generated XML against the official schemas: SAF-T (Skatteetaten),
#   pain.001 (ISO 20022) and EHF/UBL 2.1 (OASIS).
#
#   Kjøres med cargo-nextest, ikke `cargo test`: suiten er 48
#   testbinærer, 33 av dem med én eneste test, og `cargo test` kjører
#   binærer ETTER HVERANDRE. Testene venter på Postgres, ikke på CPU, så
#   det ble nesten ingen parallellitet — målt 4 m 15 s på 129 % CPU.
#   nextest planlegger hver test som sin egen prosess på tvers av
#   binærene: 1 m 11 s på 633 % CPU lokalt, 3,6× raskere, og fire
#   kjøringer på rad ga 347/347 uten flakhet. Prosjektet har ingen
#   doctests (verifisert), så nextest utelater ingenting.
#
#   Ikke skru opp --test-threads uten å se på Postgres' max_connections:
#   hver test åpner sin egen pool, så samtidighet koster forbindelser.
# - frugality: release binary sizes + regnmed-api peak RSS under load
#   against hard budgets (scripts/frugality.sh) — competing on the least
#   resources is a product principle, so a service that grows fat fails
#   the build (ROADMAP M6, docs/frugality.md).
# - portal: rebuilds the Svelte portal and fails if the checked-in
#   ui/portal/dist differs. The dist is checked in so the Rust build
#   never needs Node (#76) — that only holds if the artifact actually
#   matches its source, and a silent divergence would deploy a portal
#   nobody reviewed. Node lives HERE, never in the Rust build.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: regnmed
          POSTGRES_PASSWORD: regnmed
          POSTGRES_DB: regnmed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regnmed"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://regnmed:regnmed@localhost:5432/regnmed
    steps:
      - uses: actions/checkout@v4
      - name: Install xmllint (SAF-T, pain.001, EHF/UBL and RF-1086 XSD validation)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        run: curl -sSLf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - run: cargo fmt --all --check
      - run: cargo nextest run --workspace

  frugality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: regnmed
          POSTGRES_PASSWORD: regnmed
          POSTGRES_DB: regnmed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regnmed"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://regnmed:regnmed@localhost:5432/regnmed
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: frugality-release
      - name: Frugality gate
        run: scripts/frugality.sh | tee -a "$GITHUB_STEP_SUMMARY"

  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/portal/package-lock.json
      - run: npm ci
        working-directory: ui/portal
      - run: npm run build
        working-directory: ui/portal
      - name: dist matches source
        run: |
          if ! git diff --exit-code -- ui/portal/dist; then
            echo "ui/portal/dist er ikke bygget fra kilden — kjør scripts/build-portal.sh og sjekk inn resultatet." >&2
            exit 1
          fi
