# Builds the runtime image and pushes it to ghcr.io/bogentech/regnmed.
#
# WHY CI AND NOT THE MAC: the homelab nodes are x86_64 while the development
# Mac is aarch64, so images built locally for the dev cluster cannot run there
# at all. Building here also means the image that reaches production came from
# a commit rather than from whatever happened to be in someone's target/
# directory — and pushing needs no local registry credential, because
# GITHUB_TOKEN already has package write for repositories in this org.
#
# The runner is x86_64, so `x86_64-unknown-linux-musl` is a native build with
# musl-gcc rather than a cross-compile; only musl-tools is needed.
#
# Tags: every build gets an immutable `sha-<short>` tag, which is what the
# deploy overlays should pin (deploy/prod and deploy/test both say
# `pin-me-to-a-release`). `main` is a moving convenience tag — do not deploy
# production from it, or you lose the ability to say what is running.
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
    # deploy/** is ignored so the tag-bump commit this workflow makes at the
    # end does not trigger a second, identical build — an infinite loop with
    # an image push on every lap.
    paths-ignore:
      - "deploy/**"
      - "docs/**"
      - "*.md"
  # Manual retrigger for dropped push events (Actions incident 2026-08-06).
  # Dispatching on main behaves like a main push (incl. the gated test
  # roll); dispatching on a tag requires the workflow at that tag to have
  # this trigger, so tags from before it exist are rebuilt by re-pushing
  # the tag instead.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/bogentech/regnmed

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      # contents: write so the final step can commit the new image tag into
      # deploy/test. That commit is the deploy: Flux watches main and
      # reconciles it (see ../../../homelab/cluster/flux-regnmed.yaml). Git
      # stays the single source of truth, and no cluster credential exists in
      # GitHub at all — the cluster pulls, this workflow never reaches it.
      contents: write
      packages: write
    steps:
      # Full history: the version baked into main builds is
      # `git describe --tags` ("v0.2.5-2-g40e9a7a" = 2 commits after
      # v0.2.5), which needs the tags a shallow clone lacks.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install musl toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          rustup target add x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-image

      # The same two binaries the Dockerfile copies. --locked so a drifting
      # lockfile fails here rather than silently shipping different versions
      # of a dependency than the test job ran against.
      - name: Build static binaries
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          # Bake the build identity into the binary (compile-time
          # option_env!): the release tag when there is one, otherwise
          # `git describe` — "v0.2.5-2-g40e9a7a" reads as "2 commits
          # after v0.2.5", so the test environment's user menu names its
          # place relative to the last release instead of a bare sha.
          case "$GITHUB_REF" in
            refs/tags/v*) export REGNMED_VERSION="${GITHUB_REF#refs/tags/}" ;;
            *) export REGNMED_VERSION="$(git describe --tags --always)" ;;
          esac
          echo "REGNMED_VERSION=$REGNMED_VERSION"
          cargo build --release --locked \
            --target x86_64-unknown-linux-musl \
            -p regnmed-api -p regnmed-cli

      # The portal dist is checked in (#76) so the Rust build never needs
      # Node. The `portal` job in ci.yml is what proves it still matches its
      # source; this job only consumes it, and would happily ship a stale one.
      - name: Confirm the portal dist is present
        run: |
          test -d ui/portal/dist
          echo "dist files: $(find ui/portal/dist -type f | wc -l)"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          short=$(git rev-parse --short HEAD)
          tags="$IMAGE:sha-$short"
          case "$GITHUB_REF" in
            refs/tags/v*) tags="$tags,$IMAGE:${GITHUB_REF#refs/tags/}" ;;
            refs/heads/main) tags="$tags,$IMAGE:main" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "built tags: $tags"

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: TARGET=x86_64-unknown-linux-musl
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/BogenTech/regnmed
            org.opencontainers.image.revision=${{ github.sha }}

      # The frugality gate (docs/frugality.md) budgets the binaries at 24 MB
      # (api) and 20 MB (cli). Reported here too so a size regression is
      # visible on the artifact that actually ships, not only on the CI job's
      # own build.
      - name: Report shipped sizes
        run: |
          ls -l target/x86_64-unknown-linux-musl/release/regnmed-api \
                target/x86_64-unknown-linux-musl/release/regnmed \
            | awk '{printf "  %-16s %.1f MB\n", $9, $5/1048576}'

      # THE CI GATE (2026-08-06): the roll commit below is the deploy to
      # test, and it must not happen while the `ci` workflow is red on
      # the same commit. The two workflows run in parallel — twice today
      # test got a build whose CI later failed (the portal dist check).
      # The image push above is harmless (an image in the registry
      # deploys nothing); only the roll is gated. If ci fails, THIS job
      # fails here too, so a red deploy attempt is visible, and the next
      # green push rolls test forward again.
      - name: Wait for ci to pass on this commit
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            state=$(gh run list --commit "$GITHUB_SHA" --workflow ci.yml \
                      --json status,conclusion \
                      --jq '.[0] | if .status == "completed" then .conclusion else "pending" end' \
                    2>/dev/null || echo pending)
            case "$state" in
              success) echo "ci is green — rolling test"; exit 0 ;;
              failure|cancelled|timed_out|startup_failure)
                echo "ci concluded '$state' on $GITHUB_SHA — refusing to roll test" >&2
                exit 1 ;;
              *) echo "ci: $state — waiting"; sleep 30 ;;
            esac
          done
          echo "gave up waiting for ci after 30 minutes" >&2
          exit 1

      # THIS COMMIT IS THE DEPLOY TO TEST.
      #
      # Flux watches main and reconciles deploy/test, so writing the new
      # immutable tag into the overlay is what rolls test forward. Nothing
      # here talks to the cluster — the cluster pulls, which is why no
      # kubeconfig exists in this public repository.
      #
      # Only on main. A tag build must not rewrite the branch: the whole point
      # of a release is that the tagged commit already says what it deploys.
      # Production follows semver tags and is never touched from here.
      - name: Roll test forward to the new image
        if: github.ref == 'refs/heads/main'
        env:
          SHORT: ${{ steps.tags.outputs.short }}
        run: |
          set -euo pipefail
          # Only the test overlay's tag; regnid's line and prod are untouched.
          python3 - "$SHORT" <<'PY'
          import re, sys
          short = sys.argv[1]
          path = "deploy/test/kustomization.yaml"
          src = open(path).read()
          # Match the newTag that follows the regnmed newName, so regnid's
          # adjacent newTag cannot be hit by accident.
          pat = re.compile(
              r"(- name: regnmed\n    newName: ghcr\.io/bogentech/regnmed\n    newTag: )(\S+)"
          )
          m = pat.search(src)
          if not m:
              sys.exit("could not find regnmed's newTag in " + path)
          if m.group(2) == f"sha-{short}":
              print("already at sha-" + short)
              sys.exit(0)
          open(path, "w").write(pat.sub(rf"\1sha-{short}", src, count=1))
          print(f"{m.group(2)} -> sha-{short}")
          PY
          if git diff --quiet -- deploy/test/kustomization.yaml; then
            echo "no change to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/test/kustomization.yaml
          git commit -m "test: roll to sha-${SHORT}

          Written by .github/workflows/images.yml. Flux reconciles deploy/test
          from main, so this commit is the deploy. Production is unaffected —
          it follows semver release tags."
          # Rebase rather than force: another push may have landed while this
          # build ran, and losing it would be worse than failing here.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
