# Builds the runtime image and pushes it to ghcr.io/bogentech/regnmed.
#
# WHY CI AND NOT THE MAC: the homelab nodes are x86_64 while the development
# Mac is aarch64, so images built locally for the dev cluster cannot run there
# at all. Building here also means the image that reaches production came from
# a commit rather than from whatever happened to be in someone's target/
# directory — and pushing needs no local registry credential, because
# GITHUB_TOKEN already has package write for repositories in this org.
#
# TWO ARCHITECTURES, ONE TAG (2026-11-08): homelab is x86_64 and the Hetzner
# cluster is arm64, and during the move both must pull the SAME tag. Each
# architecture builds natively on its own runner (ubuntu-latest and
# ubuntu-24.04-arm, free for public repositories), pushes `<tag>-amd64` /
# `<tag>-arm64`, and the `publish` job joins them into one multi-arch
# manifest under the tag the overlays pin.
#
# Both builds are native, so `<arch>-unknown-linux-musl` is built with
# musl-gcc rather than cross-compiled; only musl-tools is needed.
# The runner image itself is NOT pinned, which is why the build pins its
# own instruction-set baseline instead — see the comments on the build
# step below.
#
# Tags: every build gets an immutable `sha-<short>` tag, which is what the
# deploy overlays should pin (deploy/prod and deploy/test both say
# `pin-me-to-a-release`). `main` is a moving convenience tag — do not deploy
# production from it, or you lose the ability to say what is running.
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
    # deploy/** is ignored so the tag-bump commit this workflow makes at the
    # end does not trigger a second, identical build — an infinite loop with
    # an image push on every lap.
    paths-ignore:
      - "deploy/**"
      - "docs/**"
      - "*.md"
  # Manual retrigger for dropped push events (Actions incident 2026-08-06).
  # Dispatching on main behaves like a main push (incl. the gated test
  # roll); dispatching on a tag requires the workflow at that tag to have
  # this trigger, so tags from before it exist are rebuilt by re-pushing
  # the tag instead.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/bogentech/regnmed

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            # The instruction-set floor (see the build step) is x86 only.
            rustflags: -C target-cpu=x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            rustflags: ""
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      # Full history: the version baked into main builds is
      # `git describe --tags` ("v0.2.5-2-g40e9a7a" = 2 commits after
      # v0.2.5), which needs the tags a shallow clone lacks.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A release must pin ITS OWN image, and nothing checked that until
      # 2026-10-29 — when prod was found running v0.6.4 while the v0.6.5 and
      # v0.6.6 tags had both shipped, because each of their prod overlays
      # still said v0.6.4. Flux moved to the newest tag and applied the
      # manifests from it faithfully; the manifests simply named an older
      # image. Nothing was broken, nothing was loud, and two releases
      # delivered no application code at all.
      #
      # docs/deploy.md step 2 already said to set newTag to the COMING tag in
      # the commit you tag. This is that sentence as a gate. Failing here
      # means a mispinned tag builds no image, which is the safe direction:
      # prod keeps running what it already had, and the mistake is visible
      # in Actions instead of in a version string nobody reads.
      - name: A release pins its own image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME}"
          pinned=$(awk '/name: regnmed$/{f=1} f && /newTag:/{print $2; exit}' \
                   deploy/prod/kustomization.yaml)
          echo "tag=$tag  deploy/prod pins=$pinned"
          if [ "$pinned" != "$tag" ]; then
            echo "::error::$tag pins image $pinned, not itself. Prod would keep" \
                 "running $pinned. Set newTag: $tag in deploy/prod/kustomization.yaml," \
                 "put it in the commit you tag, and cut a higher release" \
                 "(deleting a tag does not roll back — docs/deploy.md)."
            exit 1
          fi

      # Through the same fallback as ci.yml: Ubuntu's archive first, the
      # same signed package from another mirror when it is unreachable
      # (2026-11-11). ring compiles C for the musl target, so a real
      # musl-gcc is needed — and it must be there, not merely attempted.
      - name: Install musl toolchain
        run: |
          scripts/ci-apt-install.sh musl-tools
          musl-gcc --version | head -1

      # The arm64 runner image does not promise rustup, so both legs get
      # the toolchain the same way ci.yml does.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Bumped when the ISA baseline below was introduced: cached
          # objects from before it were built without -march and are
          # exactly what we are trying not to ship.
          key: musl-image-baseline-v1-${{ matrix.arch }}

      # The same two binaries the Dockerfile copies. --locked so a drifting
      # lockfile fails here rather than silently shipping different versions
      # of a dependency than the test job ran against.
      - name: Build static binaries
        env:
          # THE OLDEST NODE DEFINES THE FLOOR. `andor` is an i7-3770
          # (Ivy Bridge, 2012) with no AVX2; the rest of the cluster is
          # Kaby Lake. Nothing here may emit an instruction that node
          # cannot execute.
          #
          # This is not theoretical. When `ubuntu-latest` migrated to
          # Ubuntu 26 (from 2026-10-19) its C compiler began
          # auto-vectorising ring's portable Curve25519 code into AVX2 —
          # with no runtime CPU dispatch — and every image built after
          # that died with SIGILL the moment it was scheduled on andor,
          # during TLS setup and before a single log line. Same source,
          # same Cargo.lock; only the runner changed.
          #
          # Rust already defaults to the x86-64 baseline, so the stray
          # instructions came from the C half. Both are set anyway: a
          # default is not a guarantee, and whatever the runner does
          # next, the floor is now written down here.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CFLAGS_x86_64_unknown_linux_musl: -march=x86-64 -mtune=generic
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          # Bake the build identity into the binary (compile-time
          # option_env!): the release tag when there is one, otherwise
          # `git describe` — "v0.2.5-2-g40e9a7a" reads as "2 commits
          # after v0.2.5", so the test environment's user menu names its
          # place relative to the last release instead of a bare sha.
          case "$GITHUB_REF" in
            refs/tags/v*) export REGNMED_VERSION="${GITHUB_REF#refs/tags/}" ;;
            *) export REGNMED_VERSION="$(git describe --tags --always)" ;;
          esac
          echo "REGNMED_VERSION=$REGNMED_VERSION"
          cargo build --release --locked \
            --target ${{ matrix.target }} \
            -p regnmed-api -p regnmed-cli -p regnmed-agent

      # The flags above, CHECKED rather than trusted. They were added
      # 2026-10-19 after the Ubuntu 26 runner auto-vectorised ring past
      # the baseline; nothing asserted they kept working, and on
      # 2026-10-29 regnid shipped the identical bug because its build
      # never got them at all. A default nobody verifies is not a floor.
      #
      # `andn` is BMI1 (Haswell, 2013) and andor is Ivy Bridge (2012).
      # ring emits four behind runtime dispatch, which is fine; the
      # auto-vectorised regnid build had 53 and crashlooped during TLS
      # setup, before a single log line.
      - name: The binaries stay within the oldest node's instruction set
        if: matrix.arch == 'amd64'
        run: |
          for bin in regnmed-api regnmed regnmed-agent; do
            path="target/x86_64-unknown-linux-musl/release/$bin"
            n=$(objdump -d --no-show-raw-insn "$path" | grep -cE '\bandnq?\b' || true)
            echo "$bin: $n andn (BMI1)"
            if [ "$n" -gt 8 ]; then
              echo "::error::$bin has $n BMI1 instructions — past the x86-64"
              echo "baseline, and it will SIGILL on pre-Haswell nodes."
              exit 1
            fi
          done

      # The portal dist is checked in (#76) so the Rust build never needs
      # Node. The `portal` job in ci.yml is what proves it still matches its
      # source; this job only consumes it, and would happily ship a stale one.
      - name: Confirm the portal dist is present
        run: |
          test -d ui/portal/dist
          echo "dist files: $(find ui/portal/dist -type f | wc -l)"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the per-architecture tag; `publish` names the joined manifest.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          provenance: false
          build-args: TARGET=${{ matrix.target }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/BogenTech/regnmed
            org.opencontainers.image.revision=${{ github.sha }}

      # The frugality gate (docs/frugality.md) budgets the binaries at 24 MB
      # (api) and 20 MB (cli). Reported here too so a size regression is
      # visible on the artifact that actually ships, not only on the CI job's
      # own build.
      - name: Report shipped sizes
        run: |
          ls -l target/${{ matrix.target }}/release/regnmed-api \
                target/${{ matrix.target }}/release/regnmed \
            | awk '{printf "  %-16s %.1f MB\n", $9, $5/1048576}'

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # The final step commits the new image tag into deploy/test. That
      # commit is the deploy: Flux watches main and reconciles it
      # (bisand/hetzner tenants/regnmed). Git stays the single source of
      # truth, and no cluster credential exists in GitHub at all — the
      # cluster pulls, this workflow never reaches it.
      #
      # The push goes through the ROLL_DEPLOY_KEY deploy key, not
      # GITHUB_TOKEN: main's ruleset requires the `test` check, and GitHub
      # will not let github-actions[bot] bypass a ruleset, while a deploy
      # key can be named as a bypass actor (2026-11-11).
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.ROLL_DEPLOY_KEY }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One manifest list per tag, so either cluster pulls its own
      # architecture under the name the overlay pins.
      - name: Join the architectures under the deploy tags
        id: tags
        run: |
          set -euo pipefail
          short=$(git rev-parse --short HEAD)
          tags=(-t "$IMAGE:sha-$short")
          case "$GITHUB_REF" in
            refs/tags/v*) tags+=(-t "$IMAGE:${GITHUB_REF#refs/tags/}") ;;
            refs/heads/main) tags+=(-t "$IMAGE:main") ;;
          esac
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$short"
          echo "short=$short" >> "$GITHUB_OUTPUT"

      # THE CI GATE (2026-08-06): the roll commit below is the deploy to
      # test, and it must not happen while the `ci` workflow is red on
      # the same commit. The two workflows run in parallel — twice today
      # test got a build whose CI later failed (the portal dist check).
      # The image push above is harmless (an image in the registry
      # deploys nothing); only the roll is gated. If ci fails, THIS job
      # fails here too, so a red deploy attempt is visible, and the next
      # green push rolls test forward again.
      - name: Wait for ci to pass on this commit
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            state=$(gh run list --commit "$GITHUB_SHA" --workflow ci.yml \
                      --json status,conclusion \
                      --jq '.[0] | if .status == "completed" then .conclusion else "pending" end' \
                    2>/dev/null || echo pending)
            case "$state" in
              success) echo "ci is green — rolling test"; exit 0 ;;
              failure|cancelled|timed_out|startup_failure)
                echo "ci concluded '$state' on $GITHUB_SHA — refusing to roll test" >&2
                exit 1 ;;
              *) echo "ci: $state — waiting"; sleep 30 ;;
            esac
          done
          echo "gave up waiting for ci after 30 minutes" >&2
          exit 1

      # THIS COMMIT IS THE DEPLOY TO TEST.
      #
      # Flux watches main and reconciles deploy/test, so writing the new
      # immutable tag into the overlay is what rolls test forward. Nothing
      # here talks to the cluster — the cluster pulls, which is why no
      # kubeconfig exists in this public repository.
      #
      # Only on main. A tag build must not rewrite the branch: the whole point
      # of a release is that the tagged commit already says what it deploys.
      # Production follows semver tags and is never touched from here.
      - name: Roll test forward to the new image
        if: github.ref == 'refs/heads/main'
        env:
          SHORT: ${{ steps.tags.outputs.short }}
        run: |
          set -euo pipefail
          # Only the test overlay's tag; regnid's line and prod are untouched.
          python3 - "$SHORT" <<'PY'
          import re, sys
          short = sys.argv[1]
          path = "deploy/test/kustomization.yaml"
          src = open(path).read()
          # Match the newTag that follows the regnmed newName, so regnid's
          # adjacent newTag cannot be hit by accident.
          pat = re.compile(
              r"(- name: regnmed\n    newName: ghcr\.io/bogentech/regnmed\n    newTag: )(\S+)"
          )
          m = pat.search(src)
          if not m:
              sys.exit("could not find regnmed's newTag in " + path)
          if m.group(2) == f"sha-{short}":
              print("already at sha-" + short)
              sys.exit(0)
          open(path, "w").write(pat.sub(rf"\1sha-{short}", src, count=1))
          print(f"{m.group(2)} -> sha-{short}")
          PY
          if git diff --quiet -- deploy/test/kustomization.yaml; then
            echo "no change to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/test/kustomization.yaml
          git commit -m "test: roll to sha-${SHORT}

          Written by .github/workflows/images.yml. Flux reconciles deploy/test
          from main, so this commit is the deploy. Production is unaffected —
          it follows semver release tags."
          # Rebase rather than force: another push may have landed while this
          # build ran, and losing it would be worse than failing here.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
