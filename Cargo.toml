[workspace]
resolver = "2"
members = [
    "crates/regnmed-core",
    "crates/regnmed-db",
    "crates/regnmed-mail",
    "crates/regnmed-api",
    "crates/regnmed-cli",
    "crates/regnmed-gov",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/bisand/regnmed"

# Frugality er et produktprinsipp (docs/frugality.md), og release-profilen
# sto på Cargo-standardene. Målt på regnmed-api 2026-07-29 (lokalt):
#
#   standard                17,7 MB   (59 s)
#   + thin LTO + cgu 1      12,3 MB   (2 m 32 s)   ← valgt
#   + fat  LTO + cgu 1      10,7 MB   (3 m 04 s)
#   + strip                  8,7 MB                 ← IKKE valgt
#
# Fat LTO ble prøvd først, men frugality-jobben i CI brukte da 4 m 07 s
# på selve byggingen — og siden jobbene kjører parallelt, ble den
# klokkegivende. Thin LTO beholder mesteparten av gevinsten for merkbart
# mindre byggetid; de siste par megabytene betales én gang per
# image-pull, byggetiden ved hver eneste kjøring.
# RSS — tallet container-grensen faktisk gjelder — er upåvirket av
# valget (12-13 MB uansett).
#
# `strip` er bevisst utelatt: de siste 2 MB koster funksjonsnavnene i
# panic-backtraces, og et regnskapssystem skal kunne diagnostisere en
# hendelse i produksjon. panic="abort" er også utelatt — en panikk i én
# forespørsel skal ikke rive ned prosessen for alle andre (håndhevet av
# tests/panikk.rs).
[profile.release]
lto = "thin"
codegen-units = 1

[workspace.dependencies]
async-nats = "0.42"
futures-util = "0.3"
regnmed-core = { path = "crates/regnmed-core" }
regnmed-db = { path = "crates/regnmed-db" }
regnmed-mail = { path = "crates/regnmed-mail" }

anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
# Pure-Rust inflate, for reading the text layer out of Flate-compressed
# PDF content streams (docs/bilagstolkning.md). No C, no image codecs.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
hex = "0.4"
# Embeds the compiled Svelte portal (ui/portal/dist, checked in) in the
# binary — hashed asset filenames make per-file include_str! impractical.
include_dir = "0.7"
jsonwebtoken = "9"
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
# Bare catch-panic: en panikk i én forespørsel skal bli en 500, ikke en
# stille brutt forbindelse (og aldri en død prosess).
tower-http = { version = "0.7", default-features = false, features = [
    "catch-panic",
] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# dev-dependencies (test-only)
base64 = "0.22"
rand = "0.8"
rsa = "0.9"
tower = { version = "0.5", features = ["util"] }
