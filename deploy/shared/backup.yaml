# Backups with restore-verification (docs/deploy.md).
#
# Nightly: pg_dump custom-format dumps of both databases (regnmed,
# regnid) onto their own PVC, pruned after 14 days.
#
# Weekly: the newest regnmed dump is restored into a scratch database
# and `regnmed verify-ledger` re-walks every hash chain in the restored
# copy — proving both that the backup restores AND that the restored
# ledger is untampered. A backup that has never been restored is a
# hope, not a backup; here the restore drill is unattended and weekly.
# Point-in-time recovery (WAL archiving via CloudNativePG) is the
# documented growth path when RPO minutes matter — docs/deploy.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-data
  namespace: regnmed
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: regnmed
spec:
  schedule: "30 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 70
          containers:
            - name: dump
              image: postgres:18-alpine
              # pg_dump/psql as the postgres user, not root. fsGroup
              # below makes the backup volume writable for it.
              securityContext:
                runAsNonRoot: true
                runAsUser: 70
                runAsGroup: 70
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  # A new pod can be refused for its first seconds while a
                  # NetworkPolicy controller admits it (Hetzner, 2026-11-08);
                  # wait for a completed query, not pg_isready (docs/deploy.md).
                  for i in $(seq 1 30); do
                    psql -h postgres -U regnmed -d regnmed -qtAXc 'select 1' >/dev/null 2>&1 && break
                    sleep 2
                  done
                  stamp=$(date +%Y%m%d-%H%M%S)
                  find /backup -name '*.partial' -delete
                  # Written as .partial and renamed on success: a failed dump
                  # must never be the newest *.dump the restore drill picks.
                  for db in regnmed regnid; do
                    pg_dump -h postgres -U regnmed -Fc -f "/backup/$db-$stamp.dump.partial" "$db"
                    mv "/backup/$db-$stamp.dump.partial" "/backup/$db-$stamp.dump"
                  done
                  find /backup -name '*.dump' -mtime +14 -delete
                  ls -lh /backup | tail -5
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: password
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  memory: 32Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: backup-data
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-verify
  namespace: regnmed
spec:
  schedule: "0 4 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: restore
              image: postgres:18-alpine
              # pg_dump/psql as the postgres user, not root. fsGroup
              # below makes the backup volume writable for it.
              securityContext:
                runAsNonRoot: true
                runAsUser: 70
                runAsGroup: 70
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  for i in $(seq 1 30); do
                    psql -h postgres -U regnmed -d regnmed -qtAXc 'select 1' >/dev/null 2>&1 && break
                    sleep 2
                  done
                  latest=$(ls -t /backup/regnmed-*.dump | head -1)
                  echo "restoring $latest into regnmed_restore_check"
                  dropdb   -h postgres -U regnmed --if-exists regnmed_restore_check
                  createdb -h postgres -U regnmed regnmed_restore_check
                  pg_restore -h postgres -U regnmed -d regnmed_restore_check \
                             --no-owner "$latest"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: password
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  memory: 32Mi
                limits:
                  memory: 128Mi
          containers:
            - name: verify
              image: regnmed:dev
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              command: ["/app/regnmed", "verify-ledger"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: restore-check-url
              resources:
                requests:
                  memory: 16Mi
                limits:
                  memory: 64Mi
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: backup-data
