# Automatisk abonnementsoppfølging (#75, docs/abonnement.md §5.3):
# daglig sender den usendte abonnementsfakturaer, tar neste purresteg på
# forfalte, avslutter dekning ved langvarig mislighold og gjenoppretter
# den når betalingen kommer. Idempotent hele veien: utsendelses-id-en er
# Nats-Msg-Id, purretrappen er enveis, og beslutningene står i det
# innsettings-bare oppfølgingssporet.
#
# PROD-ONLY-mønsteret fra abonnement-faktura.yaml: driftsselskapets
# orgnr er miljøkonfigurasjon og settes i overlay-patchen — verdien her
# feiler høylytt med vilje. NATS_URL peker på klyngens egen mail-skinne
# (samme som regnmed-api-deploymenten); uten den kjører bokføringen og
# usendt e-post rapporteres som feil til noen ser etter.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: regnmed-abonnement-oppfolging
  namespace: regnmed
spec:
  schedule: "30 7 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: oppfolging
              image: regnmed:dev
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              command: ["/app/regnmed", "abonnement-oppfolging"]
              env:
                - name: REGNMED_DRIFT_ORGNR
                  value: "sett-meg-for-utrulling"
                - name: NATS_URL
                  value: nats://nats:4222
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: regnmed-url
              resources:
                requests:
                  memory: 8Mi
                limits:
                  memory: 32Mi
