# Test overlay (docs/deploy.md).
#
# Test is PROD-SHAPED, not local-shaped: replicated storage, TLS, secrets
# out of git, and every scheduled job running. The point of it is to be
# the place where the machinery is found broken — a restore drill that
# does not work, a card charge that does not post — while that is still
# cheap to discover.
#
# What differs from prod, and why:
#
# - HOSTS: test.* (ingress.yaml). Same three-host shape as prod, so the
#   portal/API/IdP split is exercised, not just assumed.
# - CLUSTER: test runs on the Hetzner cluster (arm64, bisand/hetzner, tenant
#   `regnmed-test`) while prod is still on homelab — test is the rehearsal
#   for prod's move (that repo's PLAN.md, phase 3). So test differs from prod
#   in plumbing too: Postgres is a CloudNativePG cluster (postgres.yaml),
#   volumes are local-path (patches/storage.yaml), postbud is reached through
#   a Tailscale egress proxy (postbud.yaml), and the namespace is created by
#   the platform, not by this overlay.
# - TLS: cert-manager inside the cluster, through the platform's shared
#   `letsencrypt` ClusterIssuer (HTTP-01 via Traefik). Production ACME, so
#   test shares the per-domain rate limit with regnmed.no — certificates
#   persist in secrets, so that costs one issue per host, not one per deploy.
# - STRIPE IN TEST MODE: the card rail runs against Stripe's test
#   environment with dummy cards, so abonnement invoicing and the webhook
#   that posts payment are exercised end to end. The keys come from a
#   secret created out-of-band (docs/secrets.md is absolute: no secret in
#   this repo in any form — a test key is still a key).
# - SIZES: smaller volumes and one API replica. Test proves behavior, not
#   capacity.
#
# What is deliberately the SAME as prod: the backup drill runs and verifies,
# and the images are pinned. A test environment that skips those tests
# nothing about them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Test and production will share the Hetzner cluster once prod moves, so the
# namespace differs — both inherit `regnmed` from base. The tenant stub in
# bisand/hetzner creates `regnmed-test` and confines this overlay to it.
namespace: regnmed-test

resources:
  - ../base
  - ../shared
  - ingress.yaml
  - postgres.yaml
  - postbud.yaml
# Base names the images `regnmed:dev` / `regnid:dev` — buildable locally and
# deliberately unpullable, so an unpinned overlay fails loudly instead of
# silently running something. newName points at the registry, newTag at an
# immutable sha- tag from .github/workflows/images.yml. Never `main`: it
# moves, and then nothing can say what is running.
images:
  - name: regnmed
    newName: ghcr.io/bogentech/regnmed
    newTag: sha-10d87ca
  - name: regnid
    newName: ghcr.io/bogentech/regnid
    # A RELEASE tag, not a sha: regnid started cutting releases with
    # v0.1.0, and the number an operator reads here should be the one
    # whose notes say what it contains. sha- tags remain valid for
    # deploying something unreleased.
    newTag: sha-5cda8e9
patches:
  - path: patches/postgres.yaml
  - path: patches/storage.yaml
  - path: patches/regnid.yaml
  - path: patches/regnid-mail-worker.yaml
  - path: patches/regnmed-api.yaml
  - path: patches/anchor-cronjob.yaml
  - path: patches/generate-invoices-cronjob.yaml
  - path: patches/depreciate-cronjob.yaml
  - path: patches/periodiser-cronjob.yaml
  - path: patches/abonnement-cronjob.yaml
  - path: patches/abonnement-oppfolging-cronjob.yaml
  - path: patches/agent-worker.yaml
  - path: patches/backup-cronjobs.yaml
