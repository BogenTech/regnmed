# Test overlay (docs/deploy.md).
#
# Test is PROD-SHAPED, not local-shaped: replicated storage, TLS, secrets
# out of git, and every scheduled job running. The point of it is to be
# the place where the machinery is found broken — a restore drill that
# does not work, a card charge that does not post — while that is still
# cheap to discover.
#
# What differs from prod, and why:
#
# - HOSTS: test.* (ingress.yaml). Same three-host shape as prod, so the
#   portal/API/IdP split is exercised, not just assumed.
# - TLS: terminated by nginx-proxy-manager, same as prod, with a real
#   browser-trusted certificate. This USED to be a Let's Encrypt staging
#   issuer inside the cluster, which was better in one respect — it kept
#   test off production ACME rate limits, shared per registered domain with
#   regnmed.no. That option disappeared with cert-manager: NPM owns TLS and
#   the challenge path, so nothing in the cluster can complete HTTP-01. See
#   ingress.yaml.
# - STRIPE IN TEST MODE: the card rail runs against Stripe's test
#   environment with dummy cards, so abonnement invoicing and the webhook
#   that posts payment are exercised end to end. The keys come from a
#   secret created out-of-band (docs/secrets.md is absolute: no secret in
#   this repo in any form — a test key is still a key).
# - SIZES: smaller volumes and one API replica. Test proves behavior, not
#   capacity.
#
# What is deliberately the SAME as prod: the storage class is replicated,
# the backup drill runs and verifies, and the images are pinned. A test
# environment that skips those tests nothing about them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Test and production run in the SAME cluster (five nodes is thin for two),
# so the namespace has to differ or the two overlays overwrite each other —
# both inherit `regnmed` from base. This rewrites every resource, including
# the Namespace object itself, so nothing is left pointing at production.
#
# It is not isolation. A namespace separates names, not resources: test can
# still starve prod for CPU, memory or Longhorn space. ResourceQuotas are
# the next step if that starts to matter.
namespace: regnmed-test

resources:
  - ../base
  - ../shared
  - ingress.yaml
  # cert-issuer.yaml is NOT listed here on purpose, and its absence is not an
  # oversight — it is staged for the cutover when Traefik takes 80/443 from
  # nginx-proxy-manager. Reactivating it is also what puts test back on
  # STAGING certificates; until then test shares production's ACME rate limit
  # with regnmed.no. The file has the steps.
# Base names the images `regnmed:dev` / `regnid:dev` — buildable locally and
# deliberately unpullable, so an unpinned overlay fails loudly instead of
# silently running something. newName points at the registry, newTag at an
# immutable sha- tag from .github/workflows/images.yml. Never `main`: it
# moves, and then nothing can say what is running.
images:
  - name: regnmed
    newName: ghcr.io/bogentech/regnmed
    newTag: sha-2993849
  - name: regnid
    newName: ghcr.io/bogentech/regnid
    newTag: sha-68f89cb
patches:
  - path: patches/postgres.yaml
  - path: patches/storage.yaml
  - path: patches/regnid.yaml
  - path: patches/regnmed-api.yaml
  - path: patches/anchor-cronjob.yaml
  - path: patches/generate-invoices-cronjob.yaml
  - path: patches/depreciate-cronjob.yaml
  - path: patches/abonnement-cronjob.yaml
  - path: patches/abonnement-oppfolging-cronjob.yaml
  - path: patches/backup-cronjobs.yaml
