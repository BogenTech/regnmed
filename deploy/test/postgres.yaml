# Test's Postgres on CloudNativePG (the Hetzner cluster's operator, installed
# by the platform — bisand/hetzner platform/cnpg.yaml). Replaces base's
# single-pod Deployment, which patches/postgres.yaml deletes.
#
# Two instances on two boxes, synchronous to the standby while it is up: the
# boxes have local disks only (local-path), so replication is what survives a
# lost box, not the volume. A primary left alone still takes writes
# (dataDurability: preferred) — test should keep working, not freeze.
#
# Everything that already says `postgres:5432` keeps working: base's Service
# of that name is re-pointed at the PRIMARY (patches/postgres.yaml), so the
# database URLs in db-credentials, the backup and the restore-verify jobs are
# unchanged.
#
# The login is the secret `postgres-login` (type kubernetes.io/basic-auth,
# username regnmed), created out-of-band like every other credential — and
# with the SAME password as db-credentials' URLs, or nothing can log in:
#   kubectl -n regnmed-test create secret generic postgres-login \
#     --type=kubernetes.io/basic-auth \
#     --from-literal=username=regnmed --from-literal=password=<db-credentials' password>
#
# NO BARMAN BACKUPS YET. CNPG's own recovery path (WAL archive + base backups
# to object storage) needs a bucket and a key that are regnmed's alone, and
# Hetzner S3 keys are made by hand in the console. Until then the nightly
# pg_dump + weekly restore-and-verify-ledger drill (deploy/shared/backup.yaml)
# is the backup, exactly as it was on homelab.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: regnmed
spec:
  instances: 2
  # Ubuntu 26.04's AppArmor stops a container's processes signalling each
  # other, and Postgres hangs at its first connection — the same trap as
  # homelab's 2026-10-29 outage (docs/deploy.md). The rest is CNPG's default,
  # which this field replaces.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 26
    runAsGroup: 26
    fsGroup: 26
    seccompProfile: { type: RuntimeDefault }
    appArmorProfile: { type: Unconfined }
  affinity:
    podAntiAffinityType: required
  storage: { size: 5Gi }
  bootstrap:
    initdb:
      database: regnmed
      owner: regnmed
      secret: { name: postgres-login }
  managed:
    roles:
      # What the docker image's superuser gave on homelab, and no more:
      # regnid creates its own database at startup, the restore-verify job
      # creates and drops a scratch one, and migration 0004 creates
      # regnmed_app.
      - name: regnmed
        ensure: present
        login: true
        createdb: true
        createrole: true
        passwordSecret: { name: postgres-login }
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
    parameters:
      shared_buffers: 128MB
      max_connections: "100"
      # Why: deploy/base/postgres.yaml (a half-open connection is invisible).
      authentication_timeout: 10s
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi
