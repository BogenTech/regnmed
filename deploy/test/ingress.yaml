# Test ingress: the SAME three-host shape as production, under test.*.
# The hosts must match the ISSUER/OIDC_ISSUER/PORTAL_BASE_URL values in
# patches/.
#
# Three hosts rather than two, for the same reason as prod: the portal is
# what a human opens and the API is what an integration calls, and the
# first two point at the SAME service because one binary serves both.
# That is what keeps the portal's calls same-origin — no CORS, and
# `connect-src 'self'` in the CSP still means what it says. Testing a
# two-host shape would test a topology production does not have.
#
# TLS is cert-manager's, through the Hetzner platform's shared ClusterIssuer
# `letsencrypt` (HTTP-01 via Traefik). Traffic arrives on the platform's
# Floating IP; the hosts' DNS must point there before a certificate can issue.
#
# Port 80 redirects to HTTPS, as homelab's proxy did. cert-manager's HTTP-01
# challenges are untouched: they get their own Ingress, without the middleware.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regnid
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Plain HTTP answers with a redirect (the Middleware at the end). The
    # namespace is in the name because Traefik resolves it at runtime.
    traefik.ingress.kubernetes.io/router.middlewares: regnmed-test-redirect-https@kubernetescrd
  namespace: regnmed
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - id.test.regnmed.no
      secretName: regnid-tls
  rules:
    - host: id.test.regnmed.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: regnid
                port:
                  number: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regnmed-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Plain HTTP answers with a redirect (the Middleware at the end). The
    # namespace is in the name because Traefik resolves it at runtime.
    traefik.ingress.kubernetes.io/router.middlewares: regnmed-test-redirect-https@kubernetescrd
  namespace: regnmed
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.test.regnmed.no
      secretName: regnmed-api-tls
  rules:
    - host: api.test.regnmed.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: regnmed-api
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regnmed-portal
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Plain HTTP answers with a redirect (the Middleware at the end). The
    # namespace is in the name because Traefik resolves it at runtime.
    traefik.ingress.kubernetes.io/router.middlewares: regnmed-test-redirect-https@kubernetescrd
  namespace: regnmed
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - test.regnmed.no
      secretName: regnmed-portal-tls
  rules:
    - host: test.regnmed.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: regnmed-api
                port:
                  number: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: regnmed
spec:
  redirectScheme:
    scheme: https
    permanent: true
