# postbud (the platform's outbound mail service) is reached over the tailnet
# (patches/regnid-mail-worker.yaml says why it is never a public address).
# On homelab every node was on the tailnet; on Hetzner pods are not, so this
# Service is a Tailscale EGRESS proxy: the cluster's Tailscale operator
# (bisand/hetzner platform/tailscale.yaml) runs a proxy for it and rewrites
# spec.externalName to point at that proxy.
#
# IfNotPresent because of that rewrite: Flux creates the Service and then
# leaves it alone. Applying it on every reconcile would put the placeholder
# back each time, and mail would work only between the operator's fix-ups.
# A change to this file therefore needs the Service deleted to take effect.
#
# The proxy class is the platform's: Tailscale's proxy runs more than one
# process, which Ubuntu 26.04's AppArmor stops from signalling each other.
#
# The proxy joins the tailnet as tag:regnmed, not as the platform's default
# proxy tag, so the tailnet policy grants postbud to regnmed alone. The policy
# needs both lines (Tailscale admin console):
#   "tagOwners": { "tag:regnmed": ["tag:glugg-operator"] }
#   { "src": ["tag:regnmed"], "dst": ["postbud"], "ip": ["tcp:30080"] }
apiVersion: v1
kind: Service
metadata:
  name: postbud
  namespace: regnmed
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    tailscale.com/tailnet-ip: 100.121.55.58
    tailscale.com/proxy-class: apparmor-unconfined
    tailscale.com/tags: tag:regnmed
spec:
  type: ExternalName
  externalName: placeholder
  ports:
    - name: http
      port: 30080
      protocol: TCP
