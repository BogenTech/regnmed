# Test regnmed-api: one replica, credentials from the secret, and the
# CARD RAIL ON against Stripe's TEST environment.
#
# One replica, not prod's two: test proves behavior, not capacity. Note
# what that costs — the per-process rate limiter (docs/integrations.md)
# behaves differently across two replicas than one, so a limit that looks
# right here is half as generous in prod.
#
# STRIPE. The keys come from a secret created out-of-band, exactly like
# the database credentials. docs/secrets.md is absolute — no secret in
# this repo in any form — and a `sk_test_…` key is still a key: it can
# read and write the Stripe test account, and leaking it in git means
# rotating it. Create it before the first apply:
#
#   kubectl -n regnmed create secret generic stripe-credentials \
#     --from-literal=secret-key=sk_test_… \
#     --from-literal=webhook-secret=whsec_…
#
# regnmed-api requires BOTH or neither (crates/regnmed-api/src/lib.rs):
# with one missing the rail is off and the endpoints say so, rather than
# pretending. Point the Stripe test-mode webhook at
# https://api.test.regnmed.no/webhooks/stripe and use its signing
# secret above — the signature is what authenticates that route, so a
# mismatched secret means every event is rejected.
#
# REGNMED_DRIFT_ORGNR is the ops company whose ledger the abonnement
# invoices land in. In test it must be a company that exists in the TEST
# database — onboarded from BRREG like any other. It is not the real
# operating company.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: regnmed-api
  namespace: regnmed
spec:
  replicas: 1
  template:
    spec:
      initContainers:
        - name: migrate
          env:
            - name: DATABASE_URL
              value: null
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: regnmed-url
      containers:
        - name: api
          env:
            - name: DATABASE_URL
              value: null
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: regnmed-url
            - name: OIDC_ISSUER
              value: https://id.test.regnmed.no
            # The link in the invitation mail (#66) — the portal host,
            # not the API host.
            - name: PORTAL_BASE_URL
              value: https://test.regnmed.no
            # Must match patches/abonnement-cronjob.yaml: invoices issued
            # in one ledger and payments posted in another never settle.
            - name: REGNMED_DRIFT_ORGNR
              value: "935115086"
            # Inbound bilag addresses (#35) are shown under this domain.
            # Set it only once its MX delivers into regnid's receiver.
            - name: MAIL_IN_DOMAIN
              value: bilag.test.regnmed.no
            # Opens the customer's stored provider key (docs/agent.md
            # §8.2). The worker has had this since the CronJob shipped;
            # the API never did, so every hosted-agent form was off in
            # test and said so -- correctly, but for a reason nobody had
            # noticed. Same secret, same key: the two processes seal and
            # open the same bytes, and a mismatch would mean keys stored
            # by one that the other cannot read.
            - name: AGENT_SEALING_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-credentials
                  key: sealing-key
            # Self-service agents (docs/agent.md §8.6). regnmed asks
            # regnid to create the agent's OIDC identity, so a customer
            # never sees a client_id. The client_id below must be on
            # regnid's own PROVISION_CLIENTS (patches/regnid.yaml), or
            # every call is refused with 403 — which is the point of
            # that allowlist.
            #
            # Created out-of-band, like the database and Stripe
            # credentials. `add-client` prints the secret once:
            #
            #   kubectl -n regnmed-test exec deploy/regnid -- \
            #     /app/regnid add-client --client-id regnmed-provisioner \
            #     --name "regnmed agent provisioning" \
            #     --grant-type client_credentials --confidential
            #   kubectl -n regnmed-test create secret generic regnid-provisioning \
            #     --from-literal=client-id=regnmed-provisioner \
            #     --from-file=client-secret=<the printed secret>
            #
            # BOTH or neither: regnmed-api refuses to start on half of
            # it. Without them the portal asks for a client_id as before.
            - name: REGNID_PROVISION_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: regnid-provisioning
                  key: client-id
            - name: REGNID_PROVISION_SECRET
              valueFrom:
                secretKeyRef:
                  name: regnid-provisioning
                  key: client-secret
            # In-cluster, unlike OIDC_ISSUER above. Validating a token
            # needs the issuer URL the token actually carries; asking
            # regnid to create a client does not, and the public host
            # would hairpin out through the proxy and back.
            - name: REGNID_BASE_URL
              value: http://regnid:8081
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-credentials
                  key: secret-key
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: stripe-credentials
                  key: webhook-secret
