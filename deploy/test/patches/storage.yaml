# Test volumes on the Hetzner cluster: its default class (local-path — each
# volume is a directory on ONE box's disk), at a fraction of prod's size.
#
# Postgres is not here: CNPG owns its volumes (../postgres.yaml) and survives
# a lost box by replicating to a second instance, not by replicated storage.
# What is left is the dump volume and NATS, and both are tied to the box they
# landed on: lose that box and test loses its last 14 dumps, which the next
# night starts refilling. Acceptable for test; prod's recovery path is CNPG's
# object-storage backups (bisand/hetzner PLAN.md, phase 4).
#
# The pairing rule from deploy/prod/patches/storage.yaml still holds:
# backup keeps 14 nightly `pg_dump -Fc`, and -Fc does nothing for JPEG or
# PDF, so backup needs `retention × database`. 15Gi holds 14 nights while
# the test database is under ~1 GB. If test grows past that, the honest fix
# is to reset it, not to grow the volume. (local-path does not enforce the
# size; it is the arithmetic, and the request the scheduler sees.)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-data
  namespace: regnmed
spec:
  resources:
    requests:
      storage: 15Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-data
  namespace: regnmed
spec:
  resources:
    requests:
      storage: 1Gi
