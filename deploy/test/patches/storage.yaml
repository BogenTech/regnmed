# Test volumes: the same REPLICATED class as production, at a fraction of
# the size.
#
# The class matters more than the size here. Test exists to find the
# machinery broken while that is cheap, and volume behaviour — a node
# lost, a volume reattached elsewhere, an expansion — is exactly the kind
# of thing that must not be met for the first time in production. A
# node-local class in test would prove none of it.
#
# The pairing rule from deploy/prod/patches/storage.yaml still holds:
# backup keeps 14 nightly `pg_dump -Fc`, and -Fc does nothing for JPEG or
# PDF, so backup needs `retention × database`. A full 5Gi database would
# therefore need 70Gi of backup — and 15Gi is what is here.
#
# THAT IS DELIBERATE AND IT IS A THRESHOLD: 15Gi holds 14 nights while the
# test database is under ~1 GB, which is far more than a test environment
# that gets seeded and reset should ever hold. If test grows past that,
# the honest fix is to reset it, not to grow the volume — a test database
# accumulating a year of data is a test environment nobody trusts to
# restore. Break the relationship without noticing and the backup job
# starts failing while the database still looks healthy, which is exactly
# the failure test exists to catch before production meets it.
#
# Replication multiplies these too: at Longhorn's default of 3 replicas
# this is ~63Gi of raw disk, on a pool of ~631Gi shared with production
# and GlusterFS.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: regnmed
spec:
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-data
  namespace: regnmed
spec:
  storageClassName: longhorn
  resources:
    requests:
      storage: 15Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-data
  namespace: regnmed
spec:
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
