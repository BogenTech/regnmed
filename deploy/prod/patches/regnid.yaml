# Prod regnid: real issuer URL (must match ingress host + browser URL),
# credentials from the secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: regnid
  namespace: regnmed
spec:
  template:
    spec:
      containers:
        - name: regnid
          env:
            - name: DATABASE_URL
              value: null
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: regnid-url
            - name: ISSUER
              value: https://id.regnmed.no
            # The clients allowed to call POST /provision/machine-client
            # (regnid src/provision.rs). This list IS the authorization
            # rule for that endpoint, and it is empty wherever it is not
            # set -- so the endpoint exists in the image but does
            # nothing until a line like this names someone.
            #
            # What such a client can create is narrow by construction:
            # client_credentials only, confidential only, no redirect
            # URIs. It can never mint a client people log in through, so
            # a leak of the provisioning secret cannot become a phishing
            # endpoint on id.regnmed.no -- only robots, which still need
            # a grant from a company admin before they can do anything.
            - name: PROVISION_CLIENTS
              value: regnmed-provisioner
