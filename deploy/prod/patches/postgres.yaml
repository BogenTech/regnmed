# Base's single-pod Postgres is replaced by the CNPG cluster in ../postgres.yaml.
$patch: delete
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: regnmed
---
$patch: delete
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: regnmed
---
# The Service keeps its name — every URL says `postgres:5432` — and follows
# whichever CNPG instance is primary now, so a failover moves it too.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: regnmed
spec:
  selector:
    $patch: replace
    cnpg.io/cluster: postgres
    cnpg.io/instanceRole: primary
---
# The namespace belongs to the cluster, not to the overlay: on Hetzner the
# platform's tenant stub (bisand/hetzner tenants/regnmed) creates it, and the
# ServiceAccount this overlay is applied as may not touch cluster-scoped objects.
$patch: delete
apiVersion: v1
kind: Namespace
metadata:
  name: regnmed
