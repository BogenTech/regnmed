# Prod regnmed-api: two stateless replicas, credentials from the
# secret, issuer over TLS. The migrate init container needs the same
# DATABASE_URL.
#
# THE CARD RAIL (#74, docs/abonnement.md §5) IS THREE SETTINGS, AND THEY
# ARE A SET.
#
#   STRIPE_SECRET_KEY      \ both or neither: with one missing the rail
#   STRIPE_WEBHOOK_SECRET  / is off and the endpoints say so
#   REGNMED_DRIFT_ORGNR      which ledger a confirmed charge posts into
#
# The third is the one that bites. The webhook is what turns a Stripe
# charge into a payment bilag and a closed reskontro item; without the
# orgnr it cannot tell which hovedbok that belongs in, and answers with
# an error. Stripe would still have taken the money. Enabling the first
# two without the third is therefore WORSE than leaving the rail off:
# customers are charged and the ledger never learns.
#
# It must also be the SAME orgnr as the abonnement CronJob
# (../shared/abonnement-faktura.yaml, patched below). If they disagree,
# invoices are issued in one company's ledger and the payments that
# settle them post in another's, and the reskontro never closes.
#
# The keys come from a secret created out-of-band, like the database
# credentials. docs/secrets.md is absolute — nothing in this repo, in
# any form:
#
#   kubectl -n regnmed create secret generic stripe-credentials \
#     --from-literal=secret-key=sk_live_… \
#     --from-literal=webhook-secret=whsec_…
#
# The webhook secret is the LIVE-mode endpoint's signing secret — Stripe
# issues separate ones per mode, and a test-mode secret here means every
# live event is rejected as unsigned. Point the live webhook at
# https://api.regnmed.no/webhooks/stripe.
#
# MAIL_IN_DOMAIN (#35) is plain configuration, not a secret: it is the
# domain inbound bilag addresses are shown under
# (bilag-<navn>-<tilfeldig>@…). Set it ONLY once that domain's MX
# actually delivers into regnid's mail receiver — otherwise the portal
# prints an address that silently receives nothing, which is exactly
# what the unset case is designed to avoid.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: regnmed-api
  namespace: regnmed
spec:
  replicas: 2
  template:
    spec:
      initContainers:
        - name: migrate
          env:
            - name: DATABASE_URL
              value: null
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: regnmed-url
      containers:
        - name: api
          env:
            - name: DATABASE_URL
              value: null
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: regnmed-url
            - name: OIDC_ISSUER
              value: https://id.regnmed.no
            # The link in the invitation mail (#66) — the portal's real
            # address, i.e. the regnmed-portal host in ingress.yaml, not
            # the API host.
            - name: PORTAL_BASE_URL
              value: https://regnmed.no
            # Must match ../shared/abonnement-faktura.yaml — see above.
            - name: REGNMED_DRIFT_ORGNR
              value: "935115086"
            - name: MAIL_IN_DOMAIN
              value: bilag.regnmed.no
            # Opens the customer's stored provider key (docs/agent.md
            # §8.2). The same secret and the same key as the agent
            # CronJob uses: the two processes seal and open the same
            # bytes, and two different keys would mean a key stored by
            # the API that the worker cannot read -- failing at the
            # worst moment, when an agent finally has work to do.
            #
            # Without this the hosted-agent forms are off and the portal
            # says so, which is how it went unnoticed in test for a
            # while: correct, and silent.
            - name: AGENT_SEALING_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-credentials
                  key: sealing-key
            # Self-service agents (docs/agent.md §8.6). regnmed asks
            # regnid to create the agent's OIDC identity, so a customer
            # never sees a client_id. This client_id must be on regnid's
            # own PROVISION_CLIENTS (patches/regnid.yaml) or every call
            # is refused with 403 -- which is the point of that list.
            #
            # Created out-of-band like the database credentials.
            # `add-client` prints the secret exactly once:
            #
            #   kubectl -n regnmed exec deploy/regnid -- \
            #     /app/regnid add-client --client-id regnmed-provisioner \
            #     --name "regnmed agent provisioning" \
            #     --grant-type client_credentials --confidential
            #   kubectl -n regnmed create secret generic regnid-provisioning \
            #     --from-literal=client-id=regnmed-provisioner \
            #     --from-file=client-secret=<the printed secret>
            #
            # BOTH or neither: regnmed-api refuses to start on half of
            # it. Without them the portal asks for a client_id as before.
            - name: REGNID_PROVISION_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: regnid-provisioning
                  key: client-id
            - name: REGNID_PROVISION_SECRET
              valueFrom:
                secretKeyRef:
                  name: regnid-provisioning
                  key: client-secret
            # In-cluster, unlike OIDC_ISSUER. Validating a token needs
            # the issuer URL the token actually carries; asking regnid to
            # create a client does not, and the public host would hairpin
            # out through nginx-proxy-manager and back in.
            - name: REGNID_BASE_URL
              value: http://regnid:8081
            # STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET are deliberately
            # ABSENT: the card rail is off in production for now, and the
            # portal says so rather than pretending. Everything else works
            # — hovedbok, faktura, rapporter, onboarding.
            #
            # Restoring them is the two blocks kept in the header comment
            # plus creating the secret. Do BOTH at once: the API requires
            # both keys or neither, so half the pair only turns the rail
            # off again with a less obvious message.
            #
            # When they come back they must be LIVE-mode values. A
            # test-mode key here would not fail — it would accept a real
            # card, charge nothing, and still close the reskontro item.
