# Prod volumes on the Hetzner cluster: its default class (local-path — each
# volume is a directory on ONE box's disk).
#
# Postgres is not here: CNPG owns its volumes (../postgres.yaml) and survives
# a lost box by replicating to a second instance and archiving to object
# storage — the recovery path. What is left is the dump volume (the audit
# drill) and NATS, both tied to the box they landed on: lose that box and
# the last 14 dumps go with it, while CNPG's archive still holds everything.
#
# The pairing rule still holds: backup keeps 14 nightly `pg_dump -Fc`, and
# -Fc does nothing for JPEG or PDF, so backup needs `retention × database`.
# 60Gi holds 14 nights of a database up to ~4 GB (it was 62 MB on
# 2026-11-08). local-path does not enforce the size; it is the arithmetic,
# and the request the scheduler sees.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-data
  namespace: regnmed
spec:
  resources:
    requests:
      storage: 60Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-data
  namespace: regnmed
spec:
  resources:
    requests:
      storage: 1Gi
