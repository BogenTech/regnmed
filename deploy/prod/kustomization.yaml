# Production overlay (docs/deploy.md). What it adds over the base:
#
# - Real hostnames: the hosts in ingress.yaml must match the
#   OIDC_ISSUER/ISSUER values in patches/.
# - TLS is NOT here. nginx-proxy-manager terminates it one hop earlier and
#   forwards plain HTTP to Traefik's MetalLB address; the long note in
#   ingress.yaml says why that is not a temporary shortcut but the only
#   arrangement that works while Swarm still owns the router's 80/443.
# - Secrets out of git: create the `db-credentials` secret out-of-band
#   BEFORE applying (docs/deploy.md has the exact command); the patches
#   below point every DATABASE_URL/POSTGRES_PASSWORD at it. Nothing in
#   this repo contains a production credential.
# - Backups with restore-verification (backup.yaml): nightly pg_dump,
#   weekly restore into a scratch database + `regnmed verify-ledger`
#   over the restored copy — a backup that has never been restored is a
#   hope, not a backup.
# - External anchoring witness: ANCHOR_TSA_URL on the nightly anchor
#   CronJob, so every root gets an RFC 3161 token (docs/anchoring.md).
# - Pinned images: never :dev in production — set the tags below to the
#   release you are deploying (scripts/build-images.sh output, pushed
#   to your registry).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - ingress.yaml
  # cert-issuer.yaml is NOT listed here on purpose, and its absence is not an
  # oversight — it is staged for the cutover when Traefik takes 80/443 from
  # nginx-proxy-manager. The file itself has the four steps. Adding it back
  # without also restoring the tls:/annotation pairs in ingress.yaml creates
  # an issuer nothing uses.
  # Shared with deploy/test — described once, not copied. Anything that
  # differs between the two is a patch below, so a fix to the backup
  # drill cannot land in one environment and miss the other.
  - ../shared
# Base names the images `regnmed:dev` / `regnid:dev` — buildable locally and
# deliberately unpullable, so an unpinned overlay fails loudly instead of
# silently running something. newName points at the registry, newTag at an
# immutable tag from .github/workflows/images.yml.
#
# NEVER `main` here. It moves, and a production environment that cannot say
# which commit it is running cannot be reasoned about after an incident.
#
# regnmed pins the RELEASE tag (2026-08-06): Flux applies this overlay
# from the tagged commit, and the tag build bakes REGNMED_VERSION=vX.Y.Z
# into the binary — so the version the portal's user menu shows is the
# release being run. The release flow (docs/deploy.md): verify test runs
# the sha this tag is cut from, pin the UPCOMING tag here, then tag that
# commit. The tag push builds the image; Flux may briefly ImagePullBackOff
# until it lands (~4 min) and then self-heals. The code equivalence
# sha-<short> == vX.Y.Z holds because the pin commit only touches deploy/,
# which never enters the image.
images:
  - name: regnmed
    newName: ghcr.io/bogentech/regnmed
    newTag: v0.6.0
  - name: regnid
    newName: ghcr.io/bogentech/regnid
    newTag: sha-42f8b18
patches:
  - path: patches/postgres.yaml
  - path: patches/storage.yaml
  - path: patches/regnid.yaml
  - path: patches/regnid-mail-worker.yaml
  - path: patches/regnmed-api.yaml
  - path: patches/anchor-cronjob.yaml
  - path: patches/generate-invoices-cronjob.yaml
  - path: patches/depreciate-cronjob.yaml
  - path: patches/periodiser-cronjob.yaml
  - path: patches/abonnement-cronjob.yaml
  - path: patches/abonnement-oppfolging-cronjob.yaml
