# Production ingress. The hosts must match the OIDC_ISSUER/ISSUER values in
# patches/ — a mismatch there is an OIDC failure, not an ingress failure, and
# it is diagnosed a long way from here.
#
# TLS is cert-manager's, through the Hetzner platform's shared ClusterIssuer
# `letsencrypt` (HTTP-01 via Traefik). Traffic arrives on the platform's
# Floating IP; the hosts' DNS must point there before a certificate can issue.
# (On homelab, nginx-proxy-manager terminated TLS one hop earlier; that is
# history since prod moved to the Hetzner cluster.)
#
# Port 80 redirects to HTTPS. cert-manager's HTTP-01 challenges are untouched:
# they get their own Ingress, without the middleware.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regnid
  namespace: regnmed
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Plain HTTP answers with a redirect (the Middleware at the end). The
    # namespace is in the name because Traefik resolves it at runtime.
    traefik.ingress.kubernetes.io/router.middlewares: regnmed-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - id.regnmed.no
      secretName: regnid-tls
  rules:
    - host: id.regnmed.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: regnid
                port:
                  number: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regnmed-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Plain HTTP answers with a redirect (the Middleware at the end). The
    # namespace is in the name because Traefik resolves it at runtime.
    traefik.ingress.kubernetes.io/router.middlewares: regnmed-redirect-https@kubernetescrd
  namespace: regnmed
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.regnmed.no
      secretName: regnmed-api-tls
  rules:
    - host: api.regnmed.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: regnmed-api
                port:
                  number: 8080
---
# The portal — what a human opens. Same service as the API host above:
# one binary serves the SPA and the API, which is what keeps the portal's
# own calls same-origin (see deploy/local/ingress.yaml for why that
# matters to CORS and to the CSP).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regnmed-portal
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Plain HTTP answers with a redirect (the Middleware at the end). The
    # namespace is in the name because Traefik resolves it at runtime.
    traefik.ingress.kubernetes.io/router.middlewares: regnmed-redirect-https@kubernetescrd
  namespace: regnmed
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - regnmed.no
      secretName: regnmed-portal-tls
  rules:
    - host: regnmed.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: regnmed-api
                port:
                  number: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: regnmed
spec:
  redirectScheme:
    scheme: https
    permanent: true
