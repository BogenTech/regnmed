# Production ingress. The hosts must match the OIDC_ISSUER/ISSUER values in
# patches/ — a mismatch there is an OIDC failure, not an ingress failure, and
# it is diagnosed a long way from here.
#
# NO TLS BLOCK, AND NO cert-manager ANNOTATION — deliberately.
#
# TLS is terminated one hop earlier, by nginx-proxy-manager, which holds the
# Let's Encrypt certificates and forwards plain HTTP to Traefik's MetalLB
# address. NPM has to be the edge for now because the router forwards 80/443
# to a single destination and NPM still serves a dozen other domains from
# there; it cannot route by hostname, because that is L7 and a router is L4.
#
# Asking cert-manager for certificates here would not merely be redundant, it
# CANNOT WORK: NPM terminates TLS and force-redirects HTTP, so cert-manager's
# HTTP-01 self-check is answered by NPM rather than by the solver, and the
# certificate Traefik ended up with would never be presented to anyone.
#
# WHEN TRAEFIK TAKES 80/443 (after the Swarm stacks migrate off these nodes),
# restore it: install cert-manager, add back a ClusterIssuer, and per rule add
#
#   metadata.annotations:
#     cert-manager.io/cluster-issuer: letsencrypt
#   spec.tls:
#     - hosts: [<the host below>]
#       secretName: <name>-tls
#
# See docs/deploy.md — the TLS step there is the single description of which
# hop owns certificates, and it must be updated in the same change.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regnid
  namespace: regnmed
spec:
  rules:
    - host: id.regnmed.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: regnid
                port:
                  number: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regnmed-api
  namespace: regnmed
spec:
  rules:
    - host: api.regnmed.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: regnmed-api
                port:
                  number: 8080
---
# The portal — what a human opens. Same service as the API host above:
# one binary serves the SPA and the API, which is what keeps the portal's
# own calls same-origin (see deploy/local/ingress.yaml for why that
# matters to CORS and to the CSP).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: regnmed-portal
  namespace: regnmed
spec:
  rules:
    - host: regnmed.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: regnmed-api
                port:
                  number: 8080
