# Single-instance Postgres 18 for the local cluster. Dev-grade on
# purpose (plain deployment, trivially recreatable). The regnid database
# is created by regnid itself at startup (ensure_database); POSTGRES_DB
# covers regnmed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: regnmed
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: regnmed
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # The data directory must be owned by the postgres user, or the
      # entrypoint cannot start once we stop letting it be root.
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:18-alpine
          # Always, ikke IfNotPresent: taggen FLYTER. Under hendelsen
          # 2026-10-29 viste det seg at andor kjørte PostgreSQL 18.6 mens
          # luke og mando kjørte 18.4 — samme manifest, samme tag, ulik
          # programvare, fordi hver node brukte det den tilfeldigvis
          # hadde hentet. Always holder nodene LIKE uten å pinne en
          # versjon, som er det vi vil: oppdateringer skal flyte inn,
          # men likt overalt. (docs/deploy.md)
          imagePullPolicy: Always
          # uid 70 is `postgres` in the alpine image. Without this the
          # container runs as ROOT — the image drops privileges itself,
          # but nothing was making it, and an image change would have
          # been silent.
          #
          # readOnlyRootFilesystem is deliberately NOT set: postgres
          # writes its socket to /var/run/postgresql and temp files to
          # /tmp, neither of which is a volume. Making those emptyDirs
          # to win the flag would add moving parts for no real gain —
          # the container is already unprivileged and capability-free.
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          # Frugal by design: the whole cluster lives in a 2 GB VM.
          args:
            - -c
            - shared_buffers=32MB
            - -c
            - max_connections=50
            # A connection that never finishes authenticating holds a
            # slot but is INVISIBLE to pg_stat_activity, so nothing we
            # monitor would show it piling up. 10s bounds that to a
            # couple of slots instead of every one.
            #
            # On 2026-10-29 the 60s default appeared not to fire. It DID
            # fire — AppArmor was dropping the signal (docs/deploy.md).
            # With the host profile fixed this works again, and the log
            # says so: "canceling authentication due to timeout".
            - -c
            - authentication_timeout=10s
          env:
            - name: POSTGRES_USER
              value: regnmed
            - name: POSTGRES_PASSWORD
              value: regnmed
            - name: POSTGRES_DB
              value: regnmed
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 96Mi
            limits:
              memory: 256Mi
          # NOT pg_isready (outage 2026-10-29, docs/deploy.md).
          #
          # The outage's ROOT CAUSE was not this probe: a kernel upgrade
          # made AppArmor deny signals between a container's own
          # processes and the ones the kubelet execs into it, which
          # broke PostgreSQL's SIGURG latch wakeups and its ability to
          # reap backends (containerd/containerd#14485; fixed by the
          # host AppArmor profile — see deploy/host/README.md).
          #
          # But pg_isready made us fragile to it. It deliberately
          # ABANDONS the handshake: it sends the startup packet, reads
          # the auth challenge and hangs up without authenticating and
          # without a Terminate message. The backend it leaves behind
          # can only exit on an EOF from the kernel or on
          # authentication_timeout — and both of those were shut.
          #
          # `psql -c 'select 1'` completes the protocol and sends
          # Terminate, so the backend exits because it was TOLD to,
          # needing neither an EOF nor a timer. It also proves the
          # server can answer a query, which is what "ready" was meant
          # to mean. Defence in depth, not the fix.
          readinessProbe:
            exec:
              command: ["psql", "-U", "regnmed", "-d", "regnmed", "-qtAXc", "select 1"]
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: regnmed
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
