# Single-instance Postgres 18 for the local cluster. Dev-grade on
# purpose (plain deployment, trivially recreatable). The regnid database
# is created by regnid itself at startup (ensure_database); POSTGRES_DB
# covers regnmed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: regnmed
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: regnmed
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # The data directory must be owned by the postgres user, or the
      # entrypoint cannot start once we stop letting it be root.
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:18-alpine
          # uid 70 is `postgres` in the alpine image. Without this the
          # container runs as ROOT — the image drops privileges itself,
          # but nothing was making it, and an image change would have
          # been silent.
          #
          # readOnlyRootFilesystem is deliberately NOT set: postgres
          # writes its socket to /var/run/postgresql and temp files to
          # /tmp, neither of which is a volume. Making those emptyDirs
          # to win the flag would add moving parts for no real gain —
          # the container is already unprivileged and capability-free.
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          # Frugal by design: the whole cluster lives in a 2 GB VM.
          args:
            - -c
            - shared_buffers=32MB
            - -c
            - max_connections=50
          env:
            - name: POSTGRES_USER
              value: regnmed
            - name: POSTGRES_PASSWORD
              value: regnmed
            - name: POSTGRES_DB
              value: regnmed
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 96Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "regnmed"]
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: regnmed
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
