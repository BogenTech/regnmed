# Single-instance Postgres 18 for the local cluster. Dev-grade on
# purpose (plain deployment, trivially recreatable). The regnid database
# is created by regnid itself at startup (ensure_database); POSTGRES_DB
# covers regnmed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: regnmed
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: regnmed
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # The data directory must be owned by the postgres user, or the
      # entrypoint cannot start once we stop letting it be root.
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:18-alpine
          # uid 70 is `postgres` in the alpine image. Without this the
          # container runs as ROOT — the image drops privileges itself,
          # but nothing was making it, and an image change would have
          # been silent.
          #
          # readOnlyRootFilesystem is deliberately NOT set: postgres
          # writes its socket to /var/run/postgresql and temp files to
          # /tmp, neither of which is a volume. Making those emptyDirs
          # to win the flag would add moving parts for no real gain —
          # the container is already unprivileged and capability-free.
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          # Frugal by design: the whole cluster lives in a 2 GB VM.
          args:
            - -c
            - shared_buffers=32MB
            - -c
            - max_connections=50
            # Belt to the readinessProbe's braces below. A connection that
            # never finishes authenticating holds a slot but is INVISIBLE
            # to pg_stat_activity, so nothing we monitor would show it
            # piling up. 10s bounds that to a couple of slots instead of
            # every one. Unproven against the kernel that caused
            # 2026-10-29 — the timer demonstrably did not fire there at
            # the 60s default — which is why it is the belt, not the fix.
            - -c
            - authentication_timeout=10s
          env:
            - name: POSTGRES_USER
              value: regnmed
            - name: POSTGRES_PASSWORD
              value: regnmed
            - name: POSTGRES_DB
              value: regnmed
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 96Mi
            limits:
              memory: 256Mi
          # NOT pg_isready (outage 2026-10-29, docs/deploy.md).
          #
          # pg_isready deliberately ABANDONS the handshake: it sends the
          # startup packet, reads the server's auth challenge and hangs
          # up without authenticating and without a Terminate message.
          # The backend it leaves behind is then blocked reading the
          # client's next message, and its only ways out are an EOF from
          # the kernel or authentication_timeout. On 2026-10-29 a kernel
          # upgrade (7.0.0-38 -> 7.0.0-42) stopped delivering that EOF,
          # the timeout did not fire either, and one probe every five
          # seconds filled max_connections in eight minutes — in prod,
          # test and a third, unrelated Postgres on the same cluster.
          #
          # `psql -c 'select 1'` completes the protocol and sends
          # Terminate, so the backend exits because it was TOLD to. That
          # path needs neither an EOF nor a timer, which is the point:
          # the probe no longer depends on the kernel noticing that a
          # client went away. It also actually proves the server can
          # answer a query, which is what "ready" was meant to mean.
          readinessProbe:
            exec:
              command: ["psql", "-U", "regnmed", "-d", "regnmed", "-qtAXc", "select 1"]
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: regnmed
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
