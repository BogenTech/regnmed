# SOPS configuration for DEV secrets (docs/secrets.md).
#
# Scope, deliberately narrow: this encrypts development secrets only.
# Test and production credentials never live in this repo in any form,
# encrypted or not — they are created directly in the cluster
# (docs/deploy.md) and the Maskinporten key stays outside git and
# outside container images (docs/gov.md).
#
# RECIPIENTS ARE PER MACHINE. Each machine generates its own age key and
# adds its PUBLIC key below; the private key never travels, so there is
# no "how do I securely move the key that protects my secrets" problem.
# Add a machine with `scripts/secrets.sh add-recipient <age1...>`, which
# also re-encrypts the existing files so the new machine can read them.
#
# Removing a recipient re-encrypts too, but anything that machine
# already decrypted is out — rotate the underlying secret as well.

keys:
  - &mac_mini age1yh4c2gpec3xk3x9c7u8x3ms60waa5nfcys56vayshu0aealc5fssuthlqd

creation_rules:
  # Matches the path sops is HANDED, which is the plaintext input
  # (secrets/dev.env) — not the .enc.env it is redirected into. The
  # regex is unanchored because the helper script passes absolute paths.
  - path_regex: secrets/.*\.env$
    key_groups:
      - age:
          - *mac_mini
