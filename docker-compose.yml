services:
  db:
    image: postgres:18-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: regnmed
      POSTGRES_PASSWORD: regnmed
      POSTGRES_DB: regnmed
    volumes:
      # postgres:18+ stores data in a major-version subdirectory and refuses
      # to start if the mount sits at the old /var/lib/postgresql/data path.
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
